# Layanan pendukung untuk MODE NYATA.
# Jalankan: docker compose up -d
#   - RabbitMQ  -> Kasus 3 (BROKER_DRIVER=rabbitmq)
#   - PostgreSQL-> Kasus 2 (DB_DRIVER=postgres)
# Matikan: docker compose down   (tambah -v untuk hapus data)

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: pasar-rabbitmq
    ports:
      - "5672:5672"     # protokol AMQP (dipakai aplikasi)
      - "15672:15672"   # panel admin web -> http://localhost:15672 (guest/guest)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16
    container_name: pasar-postgres
    environment:
      POSTGRES_DB: pasarmobile
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
